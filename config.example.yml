# =========================================================
# Salesforce Field Description Automation
# config.example.yml
# =========================================================
#
# WHO THIS FILE IS FOR
#
# We assume three main user groups:
#
# 1. Developers and Architects evaluating the repo
#    - They discover the project on GitHub
#    - They want to understand the setup quickly
#    - They usually start in experiment mode
#
# 2. Learners, contributors, and experimenters
#    - They want to test the classifier, prompts, and workflow
#    - They may not have Salesforce credentials
#    - They use experiment mode with synthetic data
#
# 3. Real implementers testing on a Salesforce org
#    - They often start in experiment mode first
#    - Then they switch to live metadata ingestion and real LLM calls
#    - They use this file as the bridge from experiment to MVP
#
# HOW TO USE THIS FILE
#
# 1. Copy this file to a new local file named: config.yml
# 2. Fill in your own values
# 3. Keep config.yml local only
# 4. Never commit config.yml to GitHub
#
# The scripts always read from config.yml, not from config.example.yml.
#
# WHERE THE FIELDS COME FROM, WHERE APPROVED CHANGES GO
#
# source:
#   file  reads a local metadata file (see data_source below): the synthetic
#         training and test sets. Nothing touches Salesforce.
#   org   reads the fields of the objects listed under "objects" from a
#         Salesforce org through the Salesforce CLI (salesforce.target_org).
#
# write_back (Script 2):
#   off     logs decisions only (dry run)
#   export  writes approved descriptions to a CSV the Admin applies by hand
#   deploy  writes them to the org through the Salesforce CLI (opt-in)
#
# =========================================================

source: file        # file | org
write_back: export  # off | export | deploy (quote "off": YAML reads a bare off as false)

data_source:
  # Used in experiment mode only. Ignored in production mode,
  # where data is pulled from Salesforce via the Tooling API.
  #
  # TWO SYNTHETIC FILES ARE PROVIDED FOR EXPERIMENT MODE:
  #
  # data/sf_metadata_raw_training.json  — 288 fields across 4 objects
  #   Use this file during classifier development and prompt iteration.
  #   This is the correct starting point for anyone running the
  #   experiment for the first time.
  #
  # data/sf_metadata_raw_test.json      — 144 fields across 4 objects
  #   Use this file only once, after the classifier and prompts are
  #   stable on the training set. This is the held-out validation set.
  #   Do not use it to tune the classifier or prompts — doing so
  #   defeats the purpose of the separation.
  #
  # See wiki/03_experiment_and_validation.md for the full two-phase
  # experiment methodology.
  #
  experiment_file: data/sf_metadata_raw_training.json

llm:
  # Supported providers:
  # - openai        -> any OpenAI-compatible API, e.g. a free tier for an
  #                    open-weight model (gpt-oss-120b):
  #                    Cerebras free trial (https://cloud.cerebras.ai): 30k tokens/min,
  #                    1M/day; needs a verified payment method, credits expire after 30 days.
  #                    Groq free tier (https://console.groq.com): no card, but 8k tokens
  #                    per request, too small for the current prompts (about 7.5k tokens
  #                    of fixed text per call, 9k+ with an org context file)
  # - azure_openai  -> Azure OpenAI (paid)
  # - bedrock, vertex_ai -> not implemented yet
  #
  # Free tiers are for synthetic data only. Send real org metadata only to a
  # company-approved provider such as Azure OpenAI.
  provider: openai

  # The script appends /v1/chat/completions to this address.
  # openai (Cerebras) -> https://api.cerebras.ai
  # openai (Groq)   -> https://api.groq.com/openai
  # openai (OpenAI) -> https://api.openai.com
  # azure_openai    -> https://YOUR-RESOURCE.openai.azure.com/
  # api_version: "2025-04-01-preview"   # azure_openai only; default supports gpt-5
  endpoint: https://api.groq.com/openai

  # Recommended (training set, 40-field human review, with org context):
  #   Azure gpt-5.4-mini, reasoning_effort medium: default. Tab A 80% approvable
  #   Azure gpt-6.1-sol, reasoning_effort medium: best quality (85%), ~3x the cost
  #   gpt-oss-120b (Cerebras): free, same automatic pass rate as mini; no human review yet
  # Cerebras: gpt-oss-120b. Groq: openai/gpt-oss-120b (names change — check the list)
  # Azure: your deployment name, e.g. gpt-5.4-mini. Older models (gpt-4o,
  #        gpt-4.1) are closed to new Azure subscriptions — check the
  #        Azure model retirement schedule before choosing
  model: openai/gpt-oss-120b

  # Keep local in config.yml only — never commit
  api_key: YOUR_API_KEY_HERE

  # Optional generation controls
  # temperature: 0.2       # Groq default 0.2. Leave it out on Azure for gpt-5 models: they reject it
  # reasoning_effort: medium # reasoning models only (gpt-oss, gpt-5 family): low | medium | high.
  #                         # Reasoning tokens bill as output: medium doubled gpt-5.4-mini's cost
  #                         # and was the setting that reached 80%

  # Optional prices per 1M tokens, used only for the cost estimate in the
  # run summary and in llm_response.json. Take them from your provider's
  # price list. Leave them out (or 0 for a free tier) to skip the estimate.
  # price_input_per_1m: 0.15
  # price_output_per_1m: 0.60
  # price_currency: CHF

salesforce:
  # Used when source: org (and write_back: deploy).
  # The Salesforce CLI holds the login, so no username, password or token
  # is stored here. Log in once in the browser:
  #   sf org login web --alias sfdesc-dev
  # then put that alias here. Start with a sandbox or a free Developer
  # Edition org, never production.
  target_org: sfdesc-dev

objects:
  # Salesforce objects to scan
  # Start small for first runs
  - Account
  - Contact
  - Opportunity
  - Case

options:
  # By default, only custom fields are processed.
  # If true, standard fields may also be included where writable.
  include_standard_fields: false

  # source: org sends your org's metadata to the LLM. Free tiers (Groq,
  # Cerebras, OpenRouter) are refused for that unless this is true, which is
  # only for a demo org that holds synthetic data
  allow_free_tier_with_org: false

  # Number of fields sent per LLM request.
  # 10 works on Azure and Cerebras. On a tier with a small per-request limit
  # (Groq: 8,000 tokens, HTTP 413) lower it; the script splits a batch that is too large.
  llm_batch_size: 10

  # Keep intermediate JSON/XLSX artifacts for inspection and debugging
  save_intermediate_artifacts: true

  # Send each field with up to this many other fields on the same object whose
  # names share a word (Gear_Size_Notes__c -> Clothing_Size__c), so the LLM
  # can tell what the field belongs with. 0 = off. Adds ~80 input tokens per field.
  neighbour_fields: 0

  # Optional org context: a short Markdown file written by the Admin (glossary
  # of codes, scales, systems, teams, conventions). Added to the system prompt;
  # the LLM may state its facts without listing them as assumptions.
  # Example for the synthetic org: data/org_context_synthetic.md
  org_context_file: null
