# =========================================================
# Salesforce Field Description Automation — config.example.yml
# =========================================================
#
# 1. Copy this file to config.yml   (CMD: copy config.example.yml config.yml)
# 2. Fill in PART 1. Everything in PART 2 has a working default.
# 3. Check your setup:               python scripts/check_setup.py
#
# config.yml holds your API key: keep it local, never commit it.
# Salesforce passwords are never stored here: the Salesforce CLI holds the login.
#
# =========================================================
# PART 1 — FILL IN
# =========================================================

llm:
  # provider: openai        any OpenAI-compatible API
  #           azure_openai  Azure OpenAI (paid; the recommended provider for real org data)
  #           (bedrock and vertex_ai are not implemented yet)
  provider: openai

  # The script appends /v1/chat/completions to this address.
  #   Cerebras (free trial, open-weight gpt-oss-120b): https://api.cerebras.ai
  #     Key at https://cloud.cerebras.ai. 30k tokens/min, 1M/day. Needs a verified
  #     payment method; the free credits expire after 30 days.
  #   Groq (free, no card): https://api.groq.com/openai
  #     Too small for the current prompts: 8,000 tokens per request, and one call
  #     carries about 7,500 tokens of instructions before the first field.
  #   OpenAI: https://api.openai.com
  #   Azure OpenAI: https://YOUR-RESOURCE.openai.azure.com/
  endpoint: https://api.cerebras.ai

  # Cerebras: gpt-oss-120b. Azure: your deployment name, e.g. gpt-5.4-mini.
  # Measured (wiki 03): Azure gpt-5.4-mini with reasoning_effort medium is the
  # recommended default; gpt-6.1-sol gives the best quality at ~3x the cost;
  # gpt-oss-120b is free with similar automatic pass rates (not human-reviewed).
  model: gpt-oss-120b

  api_key: YOUR_API_KEY_HERE

  # Reasoning models (gpt-oss, gpt-5 family): low | medium | high.
  # Reasoning tokens are billed as output; medium about doubles gpt-5.4-mini's cost.
  reasoning_effort: medium

  # Optional, Azure only: api_version: "2025-04-01-preview" (the default supports gpt-5)
  # Optional: temperature: 0.2. Leave it out for gpt-5 models on Azure: they reject it.
  # Optional prices per 1M tokens, only for the cost estimate in the run summary:
  # price_input_per_1m: 0.6241
  # price_output_per_1m: 3.7444
  # price_currency: CHF

# Where the fields come from:
#   file  a local metadata file (data_source below). Nothing touches Salesforce.
#   org   the objects listed below, read from salesforce.target_org through the
#         Salesforce CLI. Your org's metadata then goes to the LLM: use a
#         company-approved provider such as Azure OpenAI, never a free tier.
source: file

# Where Script 2 puts approved descriptions:
#   "off"   dry run, decisions are only logged (keep the quotes: YAML reads a bare off as false)
#   export  a CSV the Admin applies by hand (data/approved_descriptions_<timestamp>.csv)
#   deploy  written to salesforce.target_org through the Salesforce CLI (asks you to type the alias)
write_back: export

salesforce:
  # Needed for source: org and write_back: deploy. Log in once in the browser:
  #   sf org login web --alias sfdesc-dev
  # and put the alias here. Start with a sandbox or a free Developer Edition
  # org, never production.
  target_org: sfdesc-dev

# =========================================================
# PART 2 — OPTIONAL (the defaults work)
# =========================================================

data_source:
  # Used with source: file. Two synthetic sets are provided:
  #   data/sf_metadata_raw_training.json  288 fields — start here
  #   data/sf_metadata_raw_test.json      144 fields — held out: run it once at the end,
  #                                       never tune on it (wiki 03)
  experiment_file: data/sf_metadata_raw_training.json

objects:
  # Objects read with source: org
  - Account
  - Contact
  - Opportunity
  - Case

options:
  # Only custom fields (__c) unless true
  include_standard_fields: false

  # Fields sent per LLM request. 10 works on Azure and Cerebras; a batch that
  # is too large for the provider (HTTP 413) is split automatically.
  llm_batch_size: 10

  # Optional org context: a short Markdown file the Admin writes once (codes,
  # scales, systems, teams, conventions). It made the largest difference in the
  # experiment: write it for the objects you audit (wiki 03, Day 6–7).
  # Example for the synthetic org: data/org_context_synthetic.md
  org_context_file: null

  # Send each field with up to this many same-object fields whose names share a
  # word. 0 = off: it added guesses and no measurable gain (wiki 03, H3).
  neighbour_fields: 0

  # For a demo org that holds only synthetic data: allow a free-tier LLM with source: org
  allow_free_tier_with_org: false

